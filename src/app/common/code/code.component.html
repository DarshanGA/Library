<div class="code-block rounded position-relative mt-3 mb-3">
  <pre [class]="'d-flex language-' + contentType">
        <code [class]="'language-' + contentType" appPrismHighliter >{{codeContent}}</code>
    </pre>
  <button class="btn copy-button" (click)="copyCodeToClipboard()">
    <i>
      <svg
        aria-hidden="true"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        class="docs-copy"
      >
        @if(!isCodeCopied){

        <path
          d="M5 22C4.45 22 3.97917 21.8042 3.5875 21.4125C3.19583 21.0208 3 20.55 3 20V6H5V20H16V22H5ZM9 18C8.45 18 7.97917 17.8042 7.5875 17.4125C7.19583 17.0208 7 16.55 7 16V4C7 3.45 7.19583 2.97917 7.5875 2.5875C7.97917 2.19583 8.45 2 9 2H18C18.55 2 19.0208 2.19583 19.4125 2.5875C19.8042 2.97917 20 3.45 20 4V16C20 16.55 19.8042 17.0208 19.4125 17.4125C19.0208 17.8042 18.55 18 18 18H9ZM9 16H18V4H9V16Z"
          fill="#A39FA9"
        ></path>
        } @else{

        <path
          d="M4.89163 13.2687L9.16582 17.5427L18.7085 8"
          stroke="#00ff00"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        }
      </svg>
    </i>
  </button>
</div>
